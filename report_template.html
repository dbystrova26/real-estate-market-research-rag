<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{title}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a2332;
    --accent: #8c1d2b;
    --muted: #5b6472;
    --hairline: #d8dce1;
    --paper: #ffffff;
    --tint: #f4f5f7;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    color: var(--ink);
    background: var(--paper);
    max-width: 780px;
    margin: 0 auto;
    padding: 48px 32px 80px;
    line-height: 1.55;
    font-size: 16px;
  }
  .masthead { border-bottom: 3px solid var(--ink); padding-bottom: 20px; margin-bottom: 32px; }
  .masthead .kicker {
    text-transform: uppercase; letter-spacing: 0.12em; font-size: 12px;
    color: var(--accent); font-weight: 600; margin-bottom: 8px;
  }
  h1 {
    font-family: 'Source Serif 4', Georgia, serif; font-weight: 700;
    font-size: 38px; line-height: 1.12; margin: 0 0 6px;
  }
  .subtitle { font-family: 'Source Serif 4', Georgia, serif; font-size: 20px; color: var(--muted); margin: 0; }
  .meta { font-size: 13px; color: var(--muted); margin-top: 14px; }
  h2 {
    font-family: 'Source Serif 4', Georgia, serif; font-weight: 600; font-size: 24px;
    border-left: 4px solid var(--accent); padding-left: 14px; margin: 40px 0 16px;
  }
  p { margin: 0 0 16px; }
  .placeholder {
    background: var(--tint); border: 1px dashed var(--hairline); border-radius: 4px;
    padding: 10px 14px; font-size: 14px; color: var(--muted); font-style: italic;
  }
  .citation { color: var(--muted); font-size: 14px; }
  .pullquote {
    font-family: 'Source Serif 4', Georgia, serif; font-size: 19px; font-style: italic;
    color: var(--ink); border-left: 3px solid var(--accent); padding: 4px 0 4px 18px;
    margin: 28px 0;
  }
  .grounding-badge {
    display: inline-block; padding: 4px 10px; border-radius: 3px; font-size: 12px;
    font-weight: 600; letter-spacing: 0.03em;
  }
  .grounding-badge.pass { background: #e5f3ec; color: #1e6b46; }
  .grounding-badge.review { background: #fbe9e2; color: var(--accent); }
  .grounding-badge.gated { background: #eef0f2; color: var(--muted); }
  .sources { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--hairline); }
  .sources h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .sources ol { font-size: 13px; color: var(--muted); padding-left: 20px; }
  .disclaimer {
    margin-top: 40px; padding: 16px; background: var(--tint); border-radius: 4px;
    font-size: 12px; color: var(--muted); line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="masthead">
    <div class="kicker">{{kicker}}</div>
    <h1>{{title}}</h1>
    <p class="subtitle">{{subtitle}}</p>
    <div class="meta">{{generated_meta}}</div>
  </div>

  {{grounding_summary}}

  {{sections}}

  <div class="sources">
    <h3>Sources cited</h3>
    <ol>{{source_list}}</ol>
  </div>

  <div class="disclaimer">
    {{disclaimer}}
  </div>
</body>
</html>
